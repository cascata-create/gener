   tips(['教師結語：今天不是要大家變得不敢說話，而是學會多問一句：「一定要這樣嗎？」每個人都值得被當作「他自己」來看見。','邀請 3 位自願者分享，投影時隱藏座號。課後挑選匿名的優秀回應於下次上課回饋。']);
  $('#hs').checked=hideSeat;$('#hs').onchange=function(e){hideSeat=e.target.checked;schedule()};
  $('#gs').onchange=function(e){gq=e.target.value;schedule()};
  return function(){
    var qs=GQ.filter(function(q){return gq==='all'||q[0]===gq});
    var texts=[];D.reflect.forEach(function(r){qs.forEach(function(q){if(r[q[0]])texts.push(r[q[0]])})});
    var stop='我的是不會了在有也都就和你他她要這那個但因為所以可以如果';var cnt={};
    texts.forEach(function(x){var s=x.replace(/[^一-鿿]/g,'');for(var i=0;i<s.length-1;i++){var w=s.substr(i,2);if(stop.indexOf(w[0])>=0||stop.indexOf(w[1])>=0)continue;cnt[w]=(cnt[w]||0)+1}});
    var ws=Object.keys(cnt).filter(function(k){return cnt[k]>1}).sort(function(a,b){return cnt[b]-cnt[a]}).slice(0,16);
    $('#wf').innerHTML=ws.length?ws.map(function(w){return '<span class="chip">'+esc(w)+' ×'+cnt[w]+'</span>'}).join(''):'<span class="muted">內容還不夠多</span>';
    $('#ga').innerHTML=D.reflect.length?D.reflect.slice().sort(function(a,b){return (a.g-b.g)||(a.s-b.s)}).map(function(r,i){
      var body=qs.map(function(q){return r[q[0]]?'<p><b>'+esc(q[1])+'</b><br>'+esc(r[q[0]]).replace(/\n/g,'<br>')+'</p>':''}).join('');
      return body?'<div class="post" style="display:block"><span class="tag">'+(hideSeat?'同學 '+(i+1):r.g+' 組 '+r.s+' 號')+'</span>'+body+'</div>':'';
    }).join('')||'<div class="empty">這題還沒有人回答</div>':'<div class="empty">還沒有送出的省思</div>';
  };
}};

/* ---------- home ---------- */
function homeMount(root,t){
  root.innerHTML='<div class="mh"><div><h2>'+(t?'三節課流程與課前準備':'這一單元，我們要練習什麼？')+'</h2><p class="muted">綜合活動 · 七年級 · 第五主題「I」的進行式 · 第 1 單元　共 3 節 135 分鐘</p></div></div>'+
   '<div class="grid">'+LESSONS.map(function(l){return '<div class="card lesson"><h3>'+l.t+'</h3><p class="muted">'+l.g+'</p><ul>'+l.s.map(function(s){return '<li><span>'+(s[2]?'<a href="#'+s[2]+'">'+s[0]+'</a>':s[0])+'</span><span class="min">'+(s[1]?s[1]+' 分':'')+'</span></li>'}).join('')+'</ul></div>'}).join('')+'</div>'+
   (t?'<div class="card"><h3>課前準備</h3>'+PREP.map(function(p,i){return '<label class="row" style="align-items:flex-start;margin-block:6px"><input type="checkbox" style="width:auto;margin-top:6px" data-prep="'+i+'"><span>'+p+'</span></label>'}).join('')+'</div>'+
   '<div class="card"><h3>資料與隱私</h3><p>不蒐集姓名，記錄只用組別與座號。資料只用於本單元教學，課後匯出統計後依校內規範處理。匿名投稿預設教師審核後才顯示。</p><p class="muted">斷線時改用紙本備案（附件 1–4），流程相同，只是操作改為抽盒子、貼海報、寫紙本。</p></div>':'')+
   '<div class="card"><h3>這個學習網怎麼用</h3><p>跟著老師的指令打開對應的分頁。每個人的想法都被當作資料，不是考試，沒有標準答案。先看見自己腦中的「自動補圖」，才有機會改變。</p></div>';
  if(t){var ck=LS.get('gl_prep',{});$$('[data-prep]',root).forEach(function(c){c.checked=!!ck[c.dataset.prep];c.onchange=function(){ck[c.dataset.prep]=c.checked;LS.set('gl_prep',ck)}})}
  return function(){};
}
MODS.home={mount:function(r,t){return homeMount(r,t)}};

/* ---------- shell & routing ---------- */
function teacherOK(){return !S.shared||S.canEdit===true}
function shell(){
  app.innerHTML='<div class="top"><div class="brand"><span class="lens" aria-hidden="true"></span><b>性別新「視」界</b></div><div class="who"><span class="badge'+(S.teacher?' t':'')+'">'+(S.teacher?'教師端':(S.code+'・第 '+S.g+' 組・'+S.s+' 號'))+'</span>'+
   (teacherOK()?'<button class="btn sm" type="button" id="sw">'+(S.teacher?'切到學生端':'切到教師端')+'</button>':'')+'<button class="btn sm" type="button" id="lo">登出</button></div></div>'+
   '<details class="pledge" open><summary>安全討論約定（三節課都適用，匿名投稿也一樣）</summary><ol><li>對事不對人</li><li>不嘲笑、不起鬨</li><li>不猜測同學的性別認同或性傾向</li><li>可以不同意，但要說理由</li><li>聽見別人的想法時，先聽完再回應</li></ol></details>'+
   '<div id="net" class="net" hidden>網路中斷了。請改用紙本備案（附件 1–4），流程相同。</div>'+
   '<nav class="tabs" aria-label="學習模組">'+TABS.map(function(t){return '<a href="#'+t[0]+'" data-r="'+t[0]+'">'+t[1]+'</a>'}).join('')+'</nav><main id="view"></main>';
  view=$('#view');
  $('#lo').onclick=function(){LS.set('gl_user',null);current=null;unsubs.splice(0).forEach(function(f){f()});loginView()};
  var sw=$('#sw');if(sw)sw.onclick=function(){S.teacher=!S.teacher;shell();route()};
  view.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var p=b.dataset.a.split(':');var fn=ACT[p[0]];if(fn)fn(p.slice(1).join(':'),b)});
  net();
}
function net(){var n=$('#net');if(n)n.hidden=navigator.onLine!==false}
window.addEventListener('online',net);window.addEventListener('offline',net);
function route(){
  if(!view)return;
  var r=(location.hash||'#home').slice(1);if(!MODS[r])r='home';
  $$('.tabs a').forEach(function(a){if(a.dataset.r===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  view.innerHTML='';var box=document.createElement('div');view.appendChild(box);
  current={live:MODS[r].mount(box,S.teacher)};
  if(current.live)current.live();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- login ---------- */
var caps=null;
function initCaps(){
  if(caps)return caps;
  caps=new Promise(function(res){
    var done=false;function fin(){if(!done){done=true;res()}}
    setTimeout(fin,6000);
    try{
      var c=window.claude;if(!c||!c.use){fin();return}
      Promise.all([c.use('db'),c.use('user')]).then(function(a){
        db=a[0];S.shared=!!db;
        if(a[1]){return Promise.all([a[1].id(),a[1].canEdit()]).then(function(v){S.uid=v[0];S.canEdit=v[1]})}
      }).catch(function(){}).then(fin);
    }catch(e){fin()}
  });
  return caps;
}
function enter(teacher,code,g,s){
  S.code=String(code).trim().replace(/[^A-Za-z0-9_-]/g,'')||'class';S.g=g;S.s=s;S.teacher=teacher;
  LS.set('gl_user',{code:code,g:g,s:s,t:teacher});
  startSync();shell();route();
}
function loginView(){
  var u=LS.get('gl_user',null)||{};
  app.innerHTML='<div class="login"><span class="lens" aria-hidden="true" style="display:inline-block"></span><h1>性別新「視」界</h1><p class="sub">綜合活動 · 七年級 · 第五主題「I」的進行式 · 第 1 單元</p>'+
   '<form id="lf" class="card"><label class="fld"><span>班級代碼</span><input id="lc" required maxlength="20" autocomplete="off" placeholder="例如 701" value="'+esc(u.code||'')+'"></label>'+
   '<div class="two"><label class="fld"><span>組別</span><select id="lg">'+[1,2,3,4,5,6].map(function(n){return '<option value="'+n+'"'+(u.g===n?' selected':'')+'>第 '+n+' 組</option>'}).join('')+'</select></label>'+
   '<label class="fld"><span>座號</span><input id="ls" type="number" inputmode="numeric" min="1" max="60" value="'+esc(u.s||'')+'"></label></div>'+
   '<p class="muted">不需要輸入姓名，所有紀錄都以組別與座號匿名保存。</p>'+
   '<div class="row"><button class="btn primary" type="submit">進入學習網</button><button class="btn" type="button" id="tt">以教師身分進入</button></div><p class="muted" id="st"></p></form></div>';
  $('#st').textContent='連線中…';
  initCaps().then(function(){$('#st').textContent=S.shared?'已連線：全班資料會即時同步。':'單機模式：資料只保存在這台裝置。'});
  function code(){var c=$('#lc').value.trim();if(!c){$('#lc').focus();toast('請輸入班級代碼');return null}return c}
  $('#lf').onsubmit=function(e){e.preventDefault();var c=code();if(!c)return;var s=parseInt($('#ls').value,10);if(!s){toast('請輸入座號');return}
    $('#st').textContent='連線中…';initCaps().then(function(){enter(false,c,parseInt($('#lg').value,10),s)})};
  $('#tt').onclick=function(){var c=code();if(!c)return;initCaps().then(function(){if(!teacherOK()){toast('教師端只開放給這個頁面的編輯者');return}enter(true,c,0,0)})};
}
loginView();
})();
</script>

</body></html>
